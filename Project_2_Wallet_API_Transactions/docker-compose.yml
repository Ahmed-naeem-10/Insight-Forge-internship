version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: globalpay_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-globalpay_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-globalpay_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-globalpay_wallet}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-globalpay_user} -d ${POSTGRES_DB:-globalpay_wallet}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: globalpay_api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-globalpay_user}:${POSTGRES_PASSWORD:-globalpay_secret_password}@db:5432/${POSTGRES_DB:-globalpay_wallet}
      SECRET_KEY: ${SECRET_KEY:-09d25e094faa6ca2556c818166b7a9563b93f7099f6f0f4caa6cf63b88e8d3e7}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
    command: >
      sh -c "python scripts/seed_db.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data:
